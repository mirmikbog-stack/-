<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Галактика любви ❤️</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    background: #03020b;
    overflow: hidden;
    font-family: Georgia, serif;
    color: white;
}

canvas {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
}

.title {
    position: fixed;
    top: 35px;
    width: 100%;
    text-align: center;
    z-index: 2;
    color: #ffd5ed;
    font-size: 25px;
    letter-spacing: 4px;
    text-shadow: 0 0 20px #ff55b7;
}

.subtitle {
    position: fixed;
    bottom: 55px;
    width: 100%;
    text-align: center;
    z-index: 2;
    color: #ffc9e8;
    font-size: 19px;
    text-shadow: 0 0 15px #ff4caa;
    padding: 0 15px;
}

</style>
</head>

<body>

<div class="title">∞ ТЫ — МОЯ ВСЕЛЕННАЯ ∞</div>

<canvas id="galaxy"></canvas>

<div class="subtitle">
    Я люблю тебя на всех языках мира ❤️
</div>

<script>

const canvas = document.getElementById("galaxy");
const ctx = canvas.getContext("2d");

let w, h;

function resize() {
    w = canvas.width = window.innerWidth;
    h = canvas.height = window.innerHeight;
}

resize();
window.addEventListener("resize", resize);

const phrases = [
"Я тебя люблю",
"I love you",
"Je t'aime",
"Te amo",
"Ti amo",
"Ich liebe dich",
"Eu te amo",
"愛してる",
"사랑해",
"我爱你",
"Я цябе кахаю",
"Я тебе кохаю",
"Я тебя обожаю",
"أحبك",
"אני אוהב אותך",
"Σ' αγαπώ",
"Seni seviyorum",
"Ik hou van jou",
"Jag älskar dig",
"Jeg elsker deg",
"Rakastan sinua",
"Es tevi mīlu",
"Ma armastan sind",
"Volim te",
"Te iubesc",
"Kocham cię",
"Miluji tě",
"Ľúbim ťa",
"Ég elska þig",
"愛してるよ",
"Ngiyakuthanda",
"Mi amas vin",
"Main tumse pyaar karta hoon",
"আমি তোমাকে ভালোবাসি",
"நான் உன்னை காதலிக்கிறேன்",
"ฉันรักคุณ",
"Tôi yêu bạn",
"Anh yêu em",
"Mahal kita",
"Aku cinta kamu",
"دوستت دارم",
"אני אוהב אותך",
"אני אוהבת אותך",
"Te quiero",
"Aš tave myliu",
"Ik hâld fan dy",
"Mo nifẹ rẹ",
"Ke a go rata",
"Ti tengu caru",
"Ya tebya lyublyu",
"Love you forever",
"Mon amour",
"Mi amor",
"Моя любовь",
"Forever yours"
];

const colors = [
"#ff9bd2",
"#ffd6f0",
"#d9a7ff",
"#ffffff",
"#ffb5e8",
"#c9b6ff"
];

let stars = [];
let words = [];

const cx = () => w / 2;
const cy = () => h / 2;

function createGalaxy() {

    words = [];
    stars = [];

    const count = 750;
    const maxRadius = Math.min(w, h) * 0.48;

    for (let i = 0; i < count; i++) {

        let arm = Math.floor(Math.random() * 4);

        let distance = Math.random() * maxRadius;

        let angle =
            arm * Math.PI / 2 +
            distance * 0.035 +
            (Math.random() - 0.5) * 1.1;

        let spread = 0.12 + distance * 0.10;

        let x = Math.cos(angle) * distance +
            (Math.random() - 0.5) * spread * 100;

        let y = Math.sin(angle) * distance * 0.62 +
            (Math.random() - 0.5) * spread * 100;

        words.push({
            x: x,
            y: y,
            text: phrases[Math.floor(Math.random() * phrases.length)],
            size: Math.random() * 7 + 5,
            color: colors[Math.floor(Math.random() * colors.length)],
            alpha: Math.random() * 0.8 + 0.2,
            phase: Math.random() * 6.28
        });
    }

    for (let i = 0; i < 300; i++) {
        stars.push({
            x: Math.random() * w,
            y: Math.random() * h,
            size: Math.random() * 1.8,
            alpha: Math.random(),
            phase: Math.random() * 6.28
        });
    }
}

createGalaxy();

function animate(time) {

    ctx.clearRect(0, 0, w, h);

    const centerX = cx();
    const centerY = cy();

    // Космическое свечение

    let glow = ctx.createRadialGradient(
        centerX, centerY, 0,
        centerX, centerY, Math.min(w, h) * 0.55
    );

    glow.addColorStop(0, "rgba(255,90,190,0.18)");
    glow.addColorStop(0.35, "rgba(120,50,180,0.12)");
    glow.addColorStop(1, "rgba(0,0,0,0)");

    ctx.fillStyle = glow;
    ctx.fillRect(0, 0, w, h);

    // Звёзды на фоне

    stars.forEach(star => {

        let twinkle =
            0.3 + Math.sin(time * 0.001 + star.phase) * 0.5;

        ctx.globalAlpha = Math.max(0.1, twinkle);

        ctx.fillStyle = "white";

        ctx.beginPath();
        ctx.arc(star.x, star.y, star.size, 0, Math.PI * 2);
        ctx.fill();
    });

    // Галактика из надписей

    ctx.save();

    ctx.translate(centerX, centerY);

    ctx.rotate(time * 0.000025);

    words.forEach(word => {

        let pulse =
            0.55 + Math.sin(time * 0.0015 + word.phase) * 0.35;

        ctx.globalAlpha = word.alpha * pulse;

        ctx.fillStyle = word.color;

        ctx.font = `bold ${word.size}px Georgia`;

        ctx.textAlign = "center";

        ctx.shadowBlur = 9;
        ctx.shadowColor = word.color;

        ctx.fillText(
            word.text,
            word.x,
            word.y
        );

    });

    ctx.restore();

    // Яркое сердце в центре

    ctx.globalAlpha = 1;

    let heartGlow = ctx.createRadialGradient(
        centerX, centerY, 0,
        centerX, centerY, 65
    );

    heartGlow.addColorStop(0, "rgba(255,220,245,0.9)");
    heartGlow.addColorStop(0.3, "rgba(255,90,180,0.35)");
    heartGlow.addColorStop(1, "rgba(255,50,150,0)");

    ctx.fillStyle = heartGlow;

    ctx.beginPath();
    ctx.arc(centerX, centerY, 65, 0, Math.PI * 2);
    ctx.fill();

    ctx.font = "38px Arial";
    ctx.textAlign = "center";
    ctx.fillStyle = "#ffb5e8";
    ctx.shadowBlur = 25;
    ctx.shadowColor = "#ff43a5";

    ctx.fillText("♥", centerX, centerY + 13);

    ctx.shadowBlur = 0;

    requestAnimationFrame(animate);
}

requestAnimationFrame(animate);

</script>

</body>
</html>
